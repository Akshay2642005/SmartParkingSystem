terms:
  - id: parking_slot
    term: Parking Slot
    definition: A physical location where a vehicle can be parked.

  - id: occupancy
    term: Occupancy
    definition: The current state indicating whether a parking slot is occupied.

  - id: device
    term: Device
    definition: An ESP32-based edge device responsible for collecting parking sensor data.

  - id: sensor
    term: Sensor
    definition: A hardware component used to measure the physical state of a parking slot.

  - id: ultrasonic_sensor
    term: Ultrasonic Sensor
    definition: A sensor that measures distance using sound pulses; the HC-SR04 is used to detect vehicle presence in a parking slot.

  - id: hc_sr04
    term: HC-SR04
    definition: The ultrasonic distance sensor used per parking slot, wired via TRIG and ECHO GPIO pins.

  - id: hysteresis
    term: Hysteresis
    definition: The gap between the occupied threshold and the free threshold that prevents a slot state from flapping on noisy readings.

  - id: debounce
    term: Debounce
    definition: Requiring N consecutive agreeing readings before an occupancy transition fires, so a single noisy measurement cannot flip the state.

  - id: threshold
    term: Threshold
    definition: A configured distance in centimeters used to decide whether a slot is occupied or free.

  - id: telemetry
    term: Telemetry
    definition: Device-generated measurements and operational state sent to the platform.

  - id: edge_device
    term: Edge Device
    definition: A computing device located close to the physical system being monitored.

  - id: occupancy_state
    term: Occupancy State
    definition: The machine-readable representation of a parking slot's occupancy, such as FREE or OCCUPIED.

  - id: parking_lot
    term: Parking Lot
    definition: A collection of parking slots within a single managed area.

  - id: parking_lot_scan
    term: Parking Lot Scan
    definition: A single firmware pass that measures every slot sensor, updates slot state, handles failures, and refreshes lot statistics.

  - id: parking_event
    term: Parking Event
    definition: A notification that a slot changed occupancy state, such as OCCUPIED or FREED, identifying which slot changed.

  - id: parking_state
    term: Parking State
    definition: The occupancy state of a slot, one of FREE, OCCUPIED, or ERROR.

  - id: site
    term: Site
    definition: A physical location that hosts one or more parking lots.

  - id: state_machine
    term: State Machine
    definition: A model that defines the allowed states of a parking slot and the transitions between them.

  - id: device_identity
    term: Device Identity
    definition: A stable identifier that uniquely distinguishes one device from another.

  - id: heartbeat
    term: Heartbeat
    definition: A periodic message from a device indicating that it is alive and connected.

  - id: wokwi
    term: Wokwi
    definition: A browser-based hardware simulator used to develop and test the ESP32 firmware without physical hardware.

  - id: esp_idf
    term: ESP-IDF
    definition: Espressif's official framework for developing firmware for ESP32 family chips.

  - id: dashboard
    term: Dashboard
    definition: A user-facing interface that presents parking availability and slot state.
