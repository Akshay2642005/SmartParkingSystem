phases:
  - id: M0
    name: Specification
    status: active
    goal: Establish system requirements and architecture.

  - id: M1
    name: ESP32 Foundation
    status: completed
    goal: Establish firmware and simulation foundation.

  - id: M2
    name: Sensor Layer
    status: active
    goal: Integrate a sensor and derive parking occupancy.

  - id: M3
    name: Device Platform
    status: planned
