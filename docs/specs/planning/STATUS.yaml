project:
  name: Smart Parking System
  status: active

current_phase: M4

completed:
  - ESP-IDF project initialized
  - Wokwi simulation initialized
  - Rust backend scaffold initialized
  - Next.js dashboard scaffold initialized
  - Specification set established (docs/specs/)
  - M1 — ESP32 Foundation (firmware boots, clean build, Wokwi)
  - Ultrasonic (HC-SR04) sensor driver
  - Parking state machine (FREE/OCCUPIED/ERROR) with hysteresis
  - State-change events (OCCUPIED/FREED)
  - Parking lot model + statistics (total/occupied/available)
  - parking_lot_scan() API (polling moved out of main.c)
  - Parking slot configuration (3 slots, per-slot GPIO + thresholds)
  - Phase 3 — Ultrasonic sensor abstraction (GPIO validation, measurement
    range 2-400 cm, named constants, non-fatal error returns)
  - Phase 4 — Sensor measurement validation (invalid readings -> ERROR,
    never silently FREE/OCCUPIED)
  - Phase 5 — Parking slot state machine (deterministic ERROR recovery,
    pre-error state restore, no spurious events)
  - Phase 6 — Event model (events identify the slot and the measurement
    that caused the change)
  - Phase 7 — Event handling separation (handle_parking_event as the single
    consumer seam; state machine does not log)
  - Phase 8 — Lot statistics (error_count added, total = occupied + available
    + error invariant)
  - Phase 9 — Lot query API audit (four const-correct getters, query block
    documented)
  - Phase 10 — Slot query API (const read accessors for slot state and
    distance)
  - Phase 11 — Measurement stability (per-slot EMA filter, seeded on first
    valid reading; invalid readings bypass the filter)
  - Phase 12 — Occupancy debouncing (configurable N-consecutive confirmation,
    band readings reset counters, recovery stays immediate)
  - Phase 13 — Sensor polling timing (PARKING_SCAN_INTERVAL_MS constant,
    vTaskDelayUntil absolute scheduling)
  - Phase 14 — Separate parking task (dedicated xTaskCreate'd scan task with
    named stack size / priority constants; app_main returns after setup)
  - Near-floor tolerance fix (ultrasonic_distance_is_plausible shared by
    driver and parking validator; absorbs us-timing jitter at the 2 cm floor)
  - Phase 15 — Error handling strategy (policy documented; trigger-side GPIO
    failures now surface as recoverable ESP_ERR_INVALID_STATE)
  - Phase 16 — Logging convention (level table documented; WARN on ERROR
    recovery, silent band-restores stay silent)
  - Phase 17 — Configuration cleanup (parking_settings.h separates hardware
    algorithm knobs, single definition site per constant)
  - Phase 18 — Static memory review (audit table with evidence in
    firmware-architecture; 81 % stack headroom measured in Wokwi)
  - Phase 19 — Wokwi simulation improvements (wiring audit vs slot_configs,
    PARKING_DEBUG_INJECT serial hook, headless occupancy/error matrix
    scenario; verification record verifications/sensor-integration.md PASS)
  - Phase 20 — Automated local testing (host unit tests built with CMake and
    run by CTest - unit/classification, unit/debounce, unit/errors,
    unit/recovery, unit/statistics; 27 cases passing; make -C firmware/esp32
    test). Shared case sources in main/test/ also run on-target via the
    debug console `selftest` command; Wokwi scenario confirms PASS
  - Phase 21 — MQTT payload builder (pure protocol v1 JSON encoder in
    main/mqtt, byte-exact golden snapshot, host-tested; 33 host cases)
  - Phase 22 — MQTT client integration (wifi_sta blocking connect with
