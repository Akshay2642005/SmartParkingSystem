project:
  name: Smart Parking System
  status: active

current_phase: M2

completed:
  - ESP-IDF project initialized
  - Wokwi simulation initialized
  - Rust backend scaffold initialized
  - Next.js dashboard scaffold initialized
  - Specification set established (docs/specs/)
  - M1 — ESP32 Foundation (firmware boots, clean build, Wokwi)
  - Ultrasonic (HC-SR04) sensor driver
  - Parking state machine (FREE/OCCUPIED/ERROR) with hysteresis
  - State-change events (OCCUPIED/FREED)
  - Parking lot model + statistics (total/occupied/available)
  - parking_lot_scan() API (polling moved out of main.c)
  - Parking slot configuration (3 slots, per-slot GPIO + thresholds)
  - Phase 3 — Ultrasonic sensor abstraction (GPIO validation, measurement
    range 2-400 cm, named constants, non-fatal error returns)
  - Phase 4 — Sensor measurement validation (invalid readings -> ERROR,
    never silently FREE/OCCUPIED)
  - Phase 5 — Parking slot state machine (deterministic ERROR recovery,
    pre-error state restore, no spurious events)
  - Phase 6 — Event model (events identify the slot and the measurement
    that caused the change)
  - Phase 7 — Event handling separation (handle_parking_event as the single
    consumer seam; state machine does not log)
  - Phase 8 — Lot statistics (error_count added, total = occupied + available
    + error invariant)
  - Phase 9 — Lot query API audit (four const-correct getters, query block
    documented)
  - Phase 10 — Slot query API (const read accessors for slot state and
    distance)
  - Phase 11 — Measurement stability (per-slot EMA filter, seeded on first
    valid reading; invalid readings bypass the filter)
  - Phase 12 — Occupancy debouncing (configurable N-consecutive confirmation,
    band readings reset counters, recovery stays immediate)

in_progress:
  - M2 — Sensor Layer hardening (Local Embedded Logic Improvements)
  - Wokwi sensor integration verification

planned:
  - Device communication protocol (ADR-0005)
  - Device identity (ADR-0008)
  - Backend framework and persistence (ADR-0006)
  - Real-time update mechanism (ADR-0009)
  - M3 — Device Platform
  - M4 — Backend
  - M5 — Dashboard