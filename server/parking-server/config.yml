primary:
  env: development
  name: parking-server

server:
  host: 0.0.0.0
  port: 8080
  read_timeout_secs: 30
  write_timeout_secs: 30
  idle_timeout_secs: 50
  request_timeout_secs: 300
  shutdown_timeout_secs: 30
  min_graceful_shutdown_secs: 5
  cors_allowed_origins: ["http://localhost:3000"]
  path_prefix: "/api/v1"

mqtt:
  broker_uri: "mqtt://localhost:1883"

telemetry:
  service_name: parking-server
  environment: development
  filter: info
  format: compact
  ansi: true
  include_file: false
  include_line_number: false

